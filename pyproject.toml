[project]
name = "voc-analyzer"
version = "0.1.0"
description = "Voice-of-Customer analyzer for overseas social platforms"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "playwright>=1.44",
    "vaderSentiment>=3.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
llm = [
    "anthropic>=0.40",
]

[project.scripts]
voc-analyzer = "voc_analyzer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voc_analyzer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer relies on calls (Option/Argument) as parameter defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: live tests that hit a real browser/network (deselected by default)",
]
